<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的主页 — 黑马点评 · 城市生活志</title>
  <meta name="description" content="个人主页：我的笔记与关注动态。">
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./css/site.css">
</head>
<body>
<div id="app" v-cloak>
  <site-header active="profile"></site-header>

  <main class="page page--tight">
    <div class="shell">
      <nav class="crumbs" aria-label="面包屑">
        <a href="/">首页</a>
        <span class="crumbs__sep">/</span>
        <span>我的主页</span>
      </nav>

      <loading-rule v-if="loadingProfile" text="正在打开档案"></loading-rule>

      <template v-if="user.id">
        <header class="profile-head" v-reveal="0">
          <div class="profile-avatar">
            <img :src="user.icon || '/imgs/icons/default-icon.png'" :alt="user.nickName" @error="avatarFallback">
          </div>
          <div>
            <span class="kicker">USER FILE · 用户档案</span>
            <h1 class="profile-name">{{ user.nickName }}</h1>
            <div class="profile-meta">
              <span>{{ info.city || '城市未填写' }}</span>
              <span class="meta-dot" aria-hidden="true"></span>
              <span class="mono">UID {{ user.id }}</span>
            </div>
            <div class="profile-stats">
              <div><strong>{{ util.pad(blogs.length) }}</strong>近期笔记</div>
              <div><strong>{{ info.fans || 0 }}</strong>粉丝</div>
              <div><strong>{{ info.followee || 0 }}</strong>关注</div>
            </div>
          </div>
          <div class="profile-actions">
            <a class="btn btn--primary" href="/info-edit.html">
              <app-icon name="edit" :size="14"></app-icon>编辑资料
            </a>
            <button class="btn btn--ghost" type="button" @click="logout">
              <app-icon name="logout" :size="14"></app-icon>退出登录
            </button>
          </div>
        </header>

        <p class="profile-intro" v-reveal="60">
          <template v-if="info.introduce">{{ info.introduce }}</template>
          <span v-else class="profile-intro__empty">还没有填写个人介绍。</span>
        </p>

        <div class="profile-grid">
          <div>
            <div class="tabs" role="tablist" aria-label="主页内容">
              <button class="tab" type="button" role="tab" :aria-selected="tab === 'notes'" :class="{ 'is-active': tab === 'notes' }" @click="switchTab('notes')">
                <span class="mono">01</span>我的笔记
              </button>
              <button class="tab" type="button" role="tab" :aria-selected="tab === 'feed'" :class="{ 'is-active': tab === 'feed' }" @click="switchTab('feed')">
                <span class="mono">02</span>关注动态
              </button>
            </div>

            <div class="tab-panel" v-show="tab === 'notes'">
              <div class="note-list" v-if="blogs.length">
                <note-card
                  v-for="(b, i) in blogs"
                  :key="b.id"
                  :note="b"
                  variant="row"
                  :show-author="false"
                  :index="i + 1"
                  :delay="(i % 4) * 50"
                  @like="likeNote"
                ></note-card>
              </div>
              <empty-state v-else-if="!loadingProfile" title="还没有写过笔记" hint="把今天遇到的小店写下来，它会出现在这里。">
                <a class="btn btn--sm" href="/blog-edit.html">写第一篇</a>
              </empty-state>
            </div>

            <div class="tab-panel" v-show="tab === 'feed'">
              <div class="note-list" v-if="feed.length">
                <note-card
                  v-for="(b, i) in feed"
                  :key="b.id"
                  :note="b"
                  variant="row"
                  :index="i + 1"
                  :delay="(i % 4) * 50"
                  @like="likeNote"
                ></note-card>
              </div>
              <empty-state v-else-if="feedUnavailable" title="关注动态暂不可用" hint="当前后端没有可用的关注动态接口。"></empty-state>
              <empty-state v-else-if="!feedLoading" title="关注的人还没有更新" hint="去首页看看，遇到喜欢的作者记得关注。">
                <a class="btn btn--sm" href="/">去首页</a>
              </empty-state>

              <div class="loading" v-if="feedLoading" role="status">
                <span class="loading__line"></span><span class="mono">正在读取动态</span><span class="loading__line"></span>
              </div>
              <div class="feed-foot" v-if="feed.length && feedHasMore && !feedLoading">
                <button class="btn btn--ghost" type="button" @click="loadFeedMore">
                  继续阅读 <app-icon name="arrow-down" :size="15"></app-icon>
                </button>
              </div>
              <p class="feed-end" v-else-if="feed.length && !feedLoading">关注动态已读完</p>
            </div>
          </div>

          <aside aria-label="档案信息">
            <section class="aside-card">
              <div class="aside-card__head"><h2>用户档案</h2><span class="mono">FILE</span></div>
              <div class="record__row" style="grid-template-columns:70px 1fr;padding:14px 0">
                <span class="record__label">城市</span><span class="record__value">{{ info.city || '未填写' }}</span>
              </div>
              <div class="record__row" style="grid-template-columns:70px 1fr;padding:14px 0">
                <span class="record__label">性别</span><span class="record__value">{{ genderText }}</span>
              </div>
              <div class="record__row" style="grid-template-columns:70px 1fr;padding:14px 0">
                <span class="record__label">生日</span><span class="record__value mono">{{ info.birthday || '未填写' }}</span>
              </div>
              <div class="record__row" style="grid-template-columns:70px 1fr;padding:14px 0">
                <span class="record__label">积分</span><span class="record__value mono">{{ info.credits || 0 }}</span>
              </div>
              <div class="record__row" style="grid-template-columns:70px 1fr;padding:14px 0">
                <span class="record__label">会员</span><span class="record__value">{{ memberText }}</span>
              </div>
              <a class="link-arrow" href="/info-edit.html" style="margin-top:16px">查看完整档案 <app-icon name="arrow-right" :size="12"></app-icon></a>
            </section>

            <section class="aside-card">
              <div class="aside-card__head"><h2>写点什么</h2><span class="mono">WRITE</span></div>
              <p class="rail__note">一条笔记由照片、标题和正文组成。发布后可以在「我的笔记」里找到。</p>
              <a class="btn btn--block btn--sm" href="/blog-edit.html" style="margin-top:16px">开始写笔记</a>
            </section>
          </aside>
        </div>
      </template>

      <empty-state v-else-if="!loadingProfile" title="还没有登录" hint="登录后即可查看你的笔记与关注动态。">
        <a class="btn btn--sm" href="/login.html">去登录</a>
      </empty-state>
    </div>
  </main>

  <site-footer></site-footer>
</div>

<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/api.js"></script>
<script src="./js/ui.js"></script>
<script>
  new Vue({
    el: '#app',
    data: {
      util: util,
      loadingProfile: true,
      user: {},
      info: {},
      blogs: [],
      tab: 'notes',
      feed: [],
      feedLoading: false,
      feedHasMore: true,
      feedUnavailable: false,
      // 与旧版一致的滚动分页参数
      params: {
        minTime: 0,
        offset: 0
      }
    },
    computed: {
      genderText: function () {
        return util.genderText(this.info.gender);
      },
      memberText: function () {
        return util.memberText(this.info.level);
      }
    },
    created: function () {
      if (!util.loggedIn()) {
        location.replace(util.loginUrl());
        return;
      }
      this.queryUser();
    },
    methods: {
      queryUser: function () {
        var vm = this;
        // 与旧版一致：GET /user/me
        api.me()
          .then(function (data) {
            vm.user = data || {};
            if (!vm.user.id) {
              vm.loadingProfile = false;
              return;
            }
            vm.queryUserInfo();
            vm.queryBlogs();
          })
          .catch(function (err) {
            vm.loadingProfile = false;
            if (err && err.auth) {
              util.clearSession();
              location.replace(util.loginUrl());
              return;
            }
            notify(err, 'error');
          });
      },
      queryUserInfo: function () {
        var vm = this;
        // 与旧版一致：GET /user/info/{id}（没有 user_info 行时返回 null）
        api.userInfo(vm.user.id)
          .then(function (data) {
            if (!data) return;
            vm.info = data;
            sessionStorage.setItem('userInfo', JSON.stringify(data));
          })
          .catch(function (err) {
            if (err && err.auth) return;
            notify(err, 'error');
          });
      },
      queryBlogs: function () {
        var vm = this;
        // 与旧版一致：GET /blog/of/me
        api.myBlogs()
          .then(function (list) {
            vm.blogs = list || [];
            vm.loadingProfile = false;
          })
          .catch(function (err) {
            vm.loadingProfile = false;
            if (err && err.auth) {
              util.clearSession();
              location.replace(util.loginUrl());
              return;
            }
            notify(err, 'error');
          });
      },
      queryFeed: function (clear) {
        var vm = this;
        if (clear) {
          vm.params.offset = 0;
          vm.params.minTime = new Date().getTime() + 1;
          vm.feed = [];
          vm.feedHasMore = true;
          vm.feedUnavailable = false;
        }
        if (vm.feedLoading) return;
        vm.feedLoading = true;
        // 与旧版一致：GET /blog/of/follow?offset=&lastId=
        api.followFeed(vm.params.offset, vm.params.minTime || new Date().getTime() + 1)
          .then(function (data) {
            if (!data) {
              vm.feedHasMore = false;
              return;
            }
            var list = data.list || [];
            vm.feed = clear ? list : vm.feed.concat(list);
            vm.params = { minTime: data.minTime, offset: data.offset };
            vm.feedHasMore = list.length > 0;
          })
          .catch(function (err) {
            vm.feedHasMore = false;
            if (err && err.auth) {
              util.clearSession();
              location.replace(util.loginUrl());
              return;
            }
            if (err && err.status === 404) {
              // 后端实际映射为 /blog/blog/of/follow，此接口当前不可用
              vm.feedUnavailable = true;
              return;
            }
            notify(err, 'error');
          })
          .then(function () { vm.feedLoading = false; });
      },
      switchTab: function (tab) {
        this.tab = tab;
        if (tab === 'feed' && !this.feed.length && !this.feedUnavailable) this.queryFeed(true);
      },
      loadFeedMore: function () {
        if (!this.feedLoading && this.feedHasMore) this.queryFeed(false);
      },
      likeNote: function (note) {
        // 与旧版一致：PUT /blog/like/{id}，随后 GET /blog/{id}
        api.likeBlog(note.id)
          .then(function () { return api.blog(note.id); })
          .then(function (fresh) {
            note.liked = fresh.liked;
            note.isLike = fresh.isLike;
          })
          .catch(function (err) {
            if (err && err.auth) {
              util.clearSession();
              notify('登录已过期，请重新登录', 'error');
              setTimeout(function () { location.replace(util.loginUrl()); }, 260);
              return;
            }
            notify(err, 'error');
          });
      },
      logout: function () {
        // 与旧版一致：POST /user/logout；后端目前返回“功能未完成”，
        // 但退出是本地会话行为，仍然清理 token 并回首页
        api.logout().catch(function () {}).then(function () {
          util.clearSession();
          notify('已退出登录', 'success');
          setTimeout(function () { location.href = '/'; }, 400);
        });
      },
      avatarFallback: function (e) {
        e.target.src = '/imgs/icons/default-icon.png';
      }
    }
  });
</script>
</body>
</html>
