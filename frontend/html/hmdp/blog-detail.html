<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>探店笔记 · 近邻生活</title>
  <meta name="description" content="一篇关于杭州街巷的探店笔记。">
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./css/site.css">
</head>
<body>
<div id="app" v-cloak>
  <site-header active="hot"></site-header>

  <main class="page page--compact">
    <div class="shell">
      <nav class="breadcrumb" aria-label="面包屑">
        <a href="/">首页</a>
        <span>/</span>
        <span>探店笔记</span>
        <span>/</span>
        <span aria-current="page">{{ shop.name || '笔记' }}</span>
      </nav>

      <loading-rule v-if="loading" text="正在展开笔记"></loading-rule>

      <template v-if="blog.id">
        <header class="article-hero" v-reveal="0">
          <div class="article-hero__eyebrow">
            <span class="eyebrow">NOTE / 探店笔记</span>
            <span class="pill mono">NO. {{ util.pad(blog.id) }}</span>
          </div>
          <h1>{{ blog.title }}</h1>
          <div class="article-byline">
            <img class="avatar" :src="blog.icon || '/imgs/icons/default-icon.png'" alt="" @error="avatarFallback">
            <div>
              <a class="article-byline__name" :href="authorUrl">{{ blog.name || '作者' }}</a>
              <div class="mono" style="font-size:10px;color:var(--muted);margin-top:2px">
                {{ util.formatDate(blog.createTime) }} · 发布于近邻生活
              </div>
            </div>
            <button
              v-if="showFollow"
              class="btn btn--secondary btn--sm"
              type="button"
              style="margin-left:auto"
              @click="follow"
            >
              {{ followed ? '已关注' : '+ 关注作者' }}
            </button>
          </div>
        </header>

        <div class="article-gallery" v-if="images.length">
          <div class="gallery__main">
            <img :src="images[active]" :alt="blog.title" @error="imgFallback">
          </div>
          <div class="gallery__thumbs" v-if="images.length > 1">
            <button
              class="gallery__thumb"
              type="button"
              v-for="(img, i) in images"
              :key="i"
              :class="{ 'is-active': i === active }"
              @click="active = i"
              :aria-label="'第 ' + (i + 1) + ' 张图片'"
            >
              <img :src="img" :alt="blog.title + ' 图' + (i + 1)" @error="imgFallback">
            </button>
          </div>
          <p class="figcap">
            <span class="figcap__no mono">FIG.{{ util.pad(active + 1) }}</span>
            <span>笔记图片 {{ active + 1 }} / {{ images.length }} · {{ util.formatDate(blog.createTime) }}</span>
          </p>
        </div>

        <div class="article-layout">
          <article>
            <div class="prose" v-html="blog.content"></div>

            <section class="article-shop" v-if="shop.id">
              <span class="eyebrow">PLACE / 笔记里的店</span>
              <a class="shop-mini" :href="'/shop-detail.html?id=' + shop.id" style="margin-top:14px;">
                <img :src="util.firstImage(shop.images)" :alt="shop.name" @error="imgFallback">
                <div>
                  <div class="shop-mini__name">{{ shop.name }}</div>
                  <div class="shop-mini__meta">
                    <star-rating :value="(shop.score || 0) / 10" :size="12"></star-rating>
                    <span style="margin-left:8px">¥{{ shop.avgPrice || 0 }} / 人 · {{ shop.comments || 0 }} 条评价</span>
                  </div>
                  <div class="shop-mini__meta">{{ shop.address }}</div>
                </div>
                <span class="link-arrow" style="margin-left:auto;">去这家店 <app-icon name="arrow-up-right" :size="12"></app-icon></span>
              </a>
            </section>

            <div class="article-end">
              <a class="link-arrow" href="/">
                <app-icon name="arrow-left" :size="13"></app-icon>回到首页
              </a>
              <button class="btn btn--primary article-end__like" type="button" @click="toggleLike">
                <app-icon name="thumb" :size="15"></app-icon>
                {{ blog.isLike ? '已点赞' : '为这篇笔记点赞' }} · {{ blog.liked || 0 }}
              </button>
            </div>
          </article>

          <aside class="article-rail" aria-label="作者与互动">
            <section class="rail-card">
              <div class="rail-card__head"><h2>作者</h2><span class="mono">AUTHOR</span></div>
              <div class="author-card__row">
                <img class="avatar avatar--lg" :src="blog.icon || '/imgs/icons/default-icon.png'" alt="" @error="avatarFallback">
                <div>
                  <div class="author-card__name">{{ blog.name || '作者' }}</div>
                  <div class="author-card__meta">城市记录者</div>
                </div>
              </div>
              <a class="btn btn--secondary" :href="authorUrl">查看作者主页</a>
            </section>

            <section class="rail-card like-card">
              <div class="like-card__count">
                <strong>{{ blog.liked || 0 }}</strong>
                <span>PEOPLE LIKED</span>
              </div>
              <div class="liker-list" v-if="likes.length">
                <img
                  class="avatar"
                  v-for="u in likes"
                  :key="u.id"
                  :src="u.icon || '/imgs/icons/default-icon.png'"
                  :alt="u.nickName || '点赞用户'"
                  :title="u.nickName"
                  @error="avatarFallback"
                >
              </div>
              <p v-if="!logged" class="publish-note" style="margin-bottom:14px">登录后可查看点赞的人。</p>
              <p v-else-if="!likes.length" class="publish-note" style="margin-bottom:14px">还没有人点赞，做第一个。</p>
              <button class="btn btn--block" :class="blog.isLike ? 'btn--secondary' : 'btn--primary'" type="button" @click="toggleLike">
                <app-icon name="thumb" :size="14"></app-icon>{{ blog.isLike ? '取消点赞' : '点赞' }}
              </button>
            </section>

            <section class="rail-card">
              <div class="rail-card__head"><h2>关于这份记录</h2><span class="mono">INFO</span></div>
              <p class="publish-note">笔记内容与图片由作者发布，点赞数据实时来自接口。演示项目，不构成消费建议。</p>
            </section>
          </aside>
        </div>
      </template>

      <template v-else-if="needLogin && !loading">
        <h1 class="sr-only">登录后查看这篇笔记</h1>
        <empty-state title="登录后查看这篇笔记" :hint="loginHint" kicker="MEMBERS ONLY">
          <a class="btn btn--primary" :href="loginHref">登录后继续</a>
          <a class="btn btn--secondary" href="/">回到首页</a>
        </empty-state>
      </template>

      <empty-state v-else-if="!loading" title="这篇笔记找不到了" hint="它可能被作者删除，或者链接已经失效。" kicker="NOT FOUND">
        <a class="btn btn--primary" href="/">回到首页</a>
      </empty-state>
    </div>
  </main>

  <site-footer></site-footer>
</div>

<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/api.js"></script>
<script src="./js/ui.js"></script>
<script>
  new Vue({
    el: '#app',
    data: {
      util: util,
      loading: false,
      needLogin: false,
      authExpired: false,
      blog: {},
      shop: {},
      likes: [],
      user: {},
      followed: false,
      active: 0
    },
    computed: {
      images: function () {
        return util.imageList(this.blog.images);
      },
      logged: function () {
        return util.loggedIn();
      },
      showFollow: function () {
        return !!this.user.id && this.user.id !== this.blog.userId;
      },
      authorUrl: function () {
        if (!this.blog.userId) return '/';
        if (this.user.id && this.user.id === this.blog.userId) return '/info.html';
        return '/other-info.html?id=' + this.blog.userId;
      },
      loginHref: function () {
        return util.loginUrl();
      },
      loginHint: function () {
        return this.authExpired
          ? '登录状态已失效，重新登录后会回到这篇笔记。'
          : '这篇笔记需要登录后查看，登录后会回到这里。';
      }
    },
    created: function () {
      var id = util.getUrlParam('id');
      this.queryBlogById(id);
    },
    methods: {
      queryBlogById: function (id) {
        var vm = this;
        vm.loading = true;
        api.blog(id)
          .then(function (data) {
            vm.blog = data || {};
            if (vm.blog.shopId) vm.queryShopById(vm.blog.shopId);
            if (util.loggedIn()) {
              vm.queryLikeList(id);
              vm.queryLoginUser();
            }
          })
          .catch(function (err) {
            if (err && err.auth) {
              vm.authExpired = util.loggedIn();
              util.clearSession();
              vm.needLogin = true;
              return;
            }
            notify(err, 'error');
          })
          .then(function () { vm.loading = false; });
      },
      queryShopById: function (shopId) {
        var vm = this;
        api.shop(shopId)
          .then(function (data) { vm.shop = data || {}; })
          .catch(function (err) { notify(err, 'error'); });
      },
      queryLikeList: function (id) {
        var vm = this;
        if (!util.loggedIn()) return;
        api.blogLikes(id)
          .then(function (list) { vm.likes = list || []; })
          .catch(function (err) {
            if (err && err.auth) {
              util.clearSession();
              return;
            }
            notify(err, 'error');
          });
      },
      queryLoginUser: function () {
        var vm = this;
        if (!util.loggedIn()) {
          vm.user = {};
          return;
        }
        api.me()
          .then(function (user) {
            vm.user = user || {};
            if (vm.user.id !== vm.blog.userId) vm.isFollowed();
          })
          .catch(function (err) {
            if (err && err.auth) util.clearSession();
          });
      },
      isFollowed: function () {
        var vm = this;
        if (!util.loggedIn() || !this.blog.userId) return;
        api.isFollow(this.blog.userId)
          .then(function (flag) { vm.followed = !!flag; })
          .catch(function (err) {
            if (err && err.auth) {
              util.clearSession();
              return;
            }
            notify(err, 'error');
          });
      },
      follow: function () {
        var vm = this;
        if (!util.loggedIn()) {
          notify('请先登录', 'error');
          setTimeout(function () { util.goLogin(); }, 220);
          return;
        }
        api.follow(this.blog.userId, !this.followed)
          .then(function () {
            notify(vm.followed ? '已取消关注' : '已关注', 'success');
            vm.followed = !vm.followed;
          })
          .catch(function (err) {
            if (err && err.auth) {
              util.clearSession();
              notify('登录已过期，请重新登录', 'error');
              setTimeout(function () { util.goLogin(); }, 260);
              return;
            }
            notify(err, 'error');
          });
      },
      toggleLike: function () {
        var vm = this;
        if (!util.loggedIn()) {
          notify('请先登录后再点赞', 'error');
          setTimeout(function () { util.goLogin(); }, 220);
          return;
        }
        api.likeBlog(this.blog.id)
          .then(function () { return api.blog(vm.blog.id); })
          .then(function (fresh) {
            vm.blog = fresh || vm.blog;
            vm.queryLikeList(vm.blog.id);
          })
          .catch(function (err) {
            if (err && err.auth) {
              util.clearSession();
              notify('登录已过期，请重新登录', 'error');
              setTimeout(function () { util.goLogin(); }, 260);
              return;
            }
            notify(err, 'error');
          });
      },
      imgFallback: function (e) {
        e.target.src = '/imgs/placeholder.svg';
      },
      avatarFallback: function (e) {
        e.target.src = '/imgs/icons/default-icon.png';
      }
    }
  });
</script>
</body>
</html>
