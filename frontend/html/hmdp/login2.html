<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>密码登录 · 近邻生活</title>
  <meta name="description" content="使用手机号与密码登录近邻生活。">
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./css/site.css">
</head>
<body>
<div id="app" v-cloak>
  <site-header mode="bare" back="/"></site-header>

  <main class="auth-wrap">
    <div class="shell">
      <section class="auth-page">
        <aside class="auth-brand">
          <div class="auth-brand__top">
            <span class="brand__mark" style="color: var(--sage);"><app-icon name="leaf" :size="26"></app-icon></span>
            <span>近邻生活</span>
          </div>
          <div>
            <p class="auth-brand__quote">老地方，<em>welcome back</em>.</p>
            <p class="auth-brand__sub">用手机号与密码回到你的城市档案：笔记、关注与优惠券都在原处。</p>
          </div>
          <div class="auth-brand__foot mono">
            <span>NEARBY LIFE · HANGZHOU</span>
            <span>N 30°19′ · E 120°09′</span>
          </div>
        </aside>

        <div class="auth-panel">
          <div class="auth-form">
            <span class="eyebrow">MEMBER / 登录</span>
            <h1>密码登录</h1>
            <p class="auth-form__desc">使用注册手机号与密码登录。</p>

            <div class="auth-switch" role="tablist" aria-label="登录方式">
              <a href="/login.html" role="tab" aria-selected="false">验证码</a>
              <a class="is-active" href="/login2.html" role="tab" aria-selected="true">密码</a>
            </div>

            <form @submit.prevent="login" novalidate>
              <div class="field">
                <label class="field__label" for="phone">手机号</label>
                <input
                  id="phone"
                  class="input"
                  type="tel"
                  inputmode="numeric"
                  maxlength="11"
                  autocomplete="tel"
                  placeholder="请输入注册手机号"
                  v-model.trim="form.phone"
                >
              </div>

              <div class="field">
                <label class="field__label" for="password">密码</label>
                <input
                  id="password"
                  class="input"
                  type="password"
                  autocomplete="current-password"
                  placeholder="请输入密码"
                  v-model="form.password"
                >
              </div>

              <label class="agree">
                <input type="checkbox" v-model="radio" value="1">
                <span>
                  我已阅读并同意
                  <span class="agree__doc">《近邻生活用户服务协议》</span>、
                  <span class="agree__doc">《隐私政策》</span>，
                  接受免除或者限制责任、诉讼管辖约定等粗体标示条款。
                </span>
              </label>

              <button class="btn btn--primary btn--block btn--lg" type="submit">登录</button>
            </form>

            <div class="auth-alt">
              <span>演示环境 · 密码校验尚未实现</span>
              <a href="/login.html">改用验证码登录</a>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/api.js"></script>
<script src="./js/ui.js"></script>
<script>
  new Vue({
    el: '#app',
    data: {
      radio: '',
      form: {}
    },
    methods: {
      login: function () {
        if (!this.radio) {
          notify('请先确认阅读用户协议', 'error');
          return;
        }
        if (!this.form.phone || !this.form.password) {
          notify('手机号和密码不能为空', 'error');
          return;
        }
        api.login(this.form)
          .then(function (token) {
            if (token) sessionStorage.setItem('token', token);
            location.href = util.safeRedirect(util.getUrlParam('redirect'), '/index.html');
          })
          .catch(function (err) { notify(err, 'error'); });
      }
    }
  });
</script>
</body>
</html>
