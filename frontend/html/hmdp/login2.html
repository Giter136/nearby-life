<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>密码登录 — 黑马点评 · 城市生活志</title>
  <meta name="description" content="使用手机号与密码登录黑马点评。">
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./css/site.css">
</head>
<body>
<div id="app" v-cloak>
  <site-header mode="bare" back="/"></site-header>

  <section class="auth">
    <aside class="auth__aside">
      <div class="auth__mark serif">黑马点评<span>杭</span></div>
      <div>
        <p class="auth__quote">老地方，<br><em>还等你来。</em></p>
        <p class="auth__sub">用手机号与密码回到你的城市档案：笔记、关注与优惠券都在原处。</p>
      </div>
      <div class="auth__foot mono">
        <span>HANGZHOU · CITY LIFE JOURNAL</span>
        <span>N 30°19′ · E 120°09′</span>
      </div>
    </aside>

    <div class="auth__form-wrap">
      <div class="auth__panel">
        <span class="kicker auth__eyebrow">MEMBER · 登录</span>
        <h1 class="auth__title">密码登录</h1>
        <p class="auth__desc">使用注册手机号与密码登录。</p>

        <div class="auth__switch" role="tablist" aria-label="登录方式">
          <a href="/login.html" role="tab" aria-selected="false">验证码</a>
          <a class="is-active" href="/login2.html" role="tab" aria-selected="true">密码</a>
        </div>

        <form @submit.prevent="login" novalidate>
          <div class="field">
            <label class="field__label" for="phone">手机号</label>
            <input
              id="phone"
              class="input"
              type="tel"
              inputmode="numeric"
              maxlength="11"
              autocomplete="tel"
              placeholder="请输入注册手机号"
              v-model.trim="form.phone"
            >
          </div>

          <div class="field">
            <label class="field__label" for="password">密码</label>
            <input
              id="password"
              class="input"
              type="password"
              autocomplete="current-password"
              placeholder="请输入密码"
              v-model="form.password"
            >
          </div>

          <label class="agree">
            <input type="checkbox" v-model="radio" value="1">
            <span>
              我已阅读并同意
              <span class="agree__doc">《黑马点评用户服务协议》</span>、
              <span class="agree__doc">《隐私政策》</span>，
              接受免除或者限制责任、诉讼管辖约定等粗体标示条款。
            </span>
          </label>

          <button class="btn btn--primary btn--block" type="submit">登录</button>
        </form>

        <div class="auth__alt">
          <span>忘记密码请联系店主</span>
          <a href="/login.html">改用验证码登录</a>
        </div>
      </div>
    </div>
  </section>
</div>

<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/api.js"></script>
<script src="./js/ui.js"></script>
<script>
  new Vue({
    el: '#app',
    data: {
      radio: '',
      form: {}
    },
    methods: {
      login: function () {
        if (!this.radio) {
          notify('请先确认阅读用户协议', 'error');
          return;
        }
        if (!this.form.phone || !this.form.password) {
          notify('手机号和密码不能为空', 'error');
          return;
        }
        // 与旧版一致：POST /user/login（携带 phone + password）
        api.login(this.form)
          .then(function (token) {
            if (token) sessionStorage.setItem('token', token);
            location.href = util.safeRedirect(util.getUrlParam('redirect'), '/index.html');
          })
          .catch(function (err) { notify(err, 'error'); });
      }
    }
  });
</script>
</body>
</html>
