# ---------------------------------------------------------------------------
# Nearby Life（本地生活点评平台）一键启动
#
#   cp .env.example .env   # 改掉里面的密码
#   docker compose up -d --build
#
# 端口：80 -> 前端 nginx（/api 反代到 backend:8081）
# 数据库/缓存/消息队列只在 compose 内网暴露，不对宿主机开放。
# ---------------------------------------------------------------------------

name: hmdp

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # -------------------------------------------------------------------------
  # MySQL 8.0
  #   --sql-mode=NO_ENGINE_SUBSTITUTION：种子 SQL 里 tb_seckill_voucher 用了
  #   MySQL 5.7 风格的 DEFAULT '0000-00-00 00:00:00'，严格模式下会被拒绝导入。
  #   --default-authentication-plugin=mysql_native_password：mysql-connector-java
  #   5.1.47 只认 native password，不认 MySQL 8 默认的 caching_sha2_password。
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hmdp}
      MYSQL_USER: ${MYSQL_USER:-hmdp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --default-time-zone=+08:00
      # 2C/2G 小机器调优
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-instances=1
      - --performance-schema=OFF
      - --max-connections=50
      - --table-open-cache=200
      - --sort-buffer-size=524288
      - --join-buffer-size=524288
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动（数据卷为空）时自动导入种子数据
      - ./backend/src/main/resources/db/hmdp.sql:/docker-entrypoint-initdb.d/01-hmdp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Redis：只做缓存/秒杀库存，允许全部内存上限内使用，不淘汰
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Kafka 3.7.2（KRaft 单节点，无 ZooKeeper）
  # -------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.2
    restart: unless-stopped
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
      # 小内存：限制 broker 堆
      KAFKA_HEAP_OPTS: -Xms192m -Xmx256m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # 只用 TCP 探测：kafka-topics.sh 每次都要起一个 JVM，小内存机器会抖动
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/9092' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Spring Boot 后端（端口只在内网暴露，由 web 反代）
  # -------------------------------------------------------------------------
  backend:
    # 镜像名带仓库前缀：推送到 TCR 后，服务器直接 pull 这个地址
    # 不推仓库时把 IMAGE_REGISTRY 设成 local，只在本机打标签
    image: ${IMAGE_REGISTRY:-local}/hmdp-backend:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-hmdp}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-hmdp}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      SPRING_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HMDP_UPLOAD_DIR: /data/imgs
      LOGGING_LEVEL_ROOT: warn
      LOGGING_LEVEL_COM_HMDP: info
      TZ: Asia/Shanghai
    volumes:
      # 与 web 共享同一个卷：后端写入、nginx 直接对外提供
      - imgs:/data/imgs
    logging: *default-logging

  # -------------------------------------------------------------------------
  # 前端 nginx + 静态页面
  # -------------------------------------------------------------------------
  web:
    image: ${IMAGE_REGISTRY:-local}/hmdp-web:${TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - imgs:/usr/share/nginx/html/imgs
    logging: *default-logging

volumes:
  mysql_data:
  kafka_data:
  # 用户上传图片（前后端共享；首次创建时从镜像内置的种子图初始化）
  imgs:
