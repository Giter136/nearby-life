server:
  port: 8081
spring:
  # 默认加载 application-local.yaml（本机私有配置，已被 .gitignore 忽略）
  # 换环境：命令行加 --spring.profiles.active=prod，或设环境变量 SPRING_PROFILES_ACTIVE（优先级更高）
  profiles:
    active: local
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      group-id: voucher-order-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: record
hmdp:
  upload:
    # 图片上传根目录。留空则从当前工作目录向上查找 frontend/html/hmdp/imgs
    # 换机器 / 部署到服务器时，用环境变量 HMDP_UPLOAD_DIR 覆盖即可，不必改代码
    dir: ${HMDP_UPLOAD_DIR:}

mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
